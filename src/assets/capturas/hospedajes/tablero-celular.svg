  <text x="30" y="312" font-family="'Archivo', system-ui, sans-serif" font-weight="700" font-size="15" fill="#0E2439">Resumen del Turno Actual</text>
  
  <line x1="30" y1="324" x2="330" y2="324" stroke="#D3DCE5" stroke-width="1"/>
  
  <text x="30" y="352" font-family="'Archivo', system-ui, sans-serif" font-size="14" fill="#4A5B6C">Total recaudado:</text>
