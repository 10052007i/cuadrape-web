  <!-- Grilla de Habitaciones -->
  <!-- Hab 101 Libre -->
  <rect x="15" y="82" width="100" height="85" rx="10" fill="#EBFBEE" stroke="#27C468" stroke-width="1.5"/>
  <text x="25" y="115" font-family="'Archivo', system-ui, sans-serif" font-weight="700" font-size="15" fill="#1E7E44">Hab. 101</text>
  <rect x="25" y="128" width="54" height="20" rx="4" fill="#27C468"/>
