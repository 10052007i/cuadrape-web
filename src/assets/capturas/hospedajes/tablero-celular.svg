  <text x="30" y="405" font-family="'Archivo', system-ui, sans-serif" font-size="13" fill="#4A5B6C">Efectivo en caja:</text>
  <text x="180" y="405" font-family="'Archivo', system-ui, sans-serif" font-weight="600" font-size="13" fill="#0E2439">S/ 240.00</text>

  <!-- Botón Acción Inferior -->
